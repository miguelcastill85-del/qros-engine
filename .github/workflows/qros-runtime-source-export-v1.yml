name: QROS Runtime Source Export v1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qros-runtime-source-export-v1.yml'
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify and stage exact runtime package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime_package/scripts runtime_package/research/public1000/seed0076
          cp scripts/qros_seed0076_ga1_group_worker_v222.py runtime_package/scripts/
          cp scripts/qros_seed0076_carrier_masks_v221.py runtime_package/scripts/
          cp scripts/qros_seed0076_gate_engine_v221.py runtime_package/scripts/
          cp scripts/qros_seed0076_structural_v220.py runtime_package/scripts/
          cp scripts/qros_seed0076_config_stream.py runtime_package/scripts/
          cp scripts/qros_public1000_w09c_group11_wrapper_v1.py runtime_package/scripts/
          cp scripts/qros_heavy_job_supervisor_v1.py runtime_package/scripts/
          cp scripts/qros_heavy_job_supervisor_v2.py runtime_package/scripts/
          cp research/public1000/seed0076/QROS_SEED0076_MACHINE_UNIVERSE_SPEC_V209_v1.json runtime_package/research/public1000/seed0076/
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('runtime_package')
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              b=p.read_bytes()
              blob=hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
              rows.append({'path':str(p.relative_to(root)),'bytes':len(b),'git_blob_sha1':blob,'sha256':hashlib.sha256(b).hexdigest()})
          payload={'schema':'QROS_RUNTIME_SOURCE_EXPORT_1.0','commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':rows}
          (root/'manifest.json').write_text(json.dumps(payload,sort_keys=True,indent=2)+'\n')
          PY
      - name: Upload runtime package
        uses: actions/upload-artifact@v4
        with:
          name: qros-runtime-source-package
          path: runtime_package
          if-no-files-found: error
          retention-days: 1
