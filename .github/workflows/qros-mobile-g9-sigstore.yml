name: QROS G9 synthetic hash transparency explicit gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  witness:
    if: github.ref == 'refs/heads/product/mobile-g9-cloudflare-android-20260926' && vars.QROS_G9_PUBLIC_WORKFLOW_IDENTITY_AUTHORIZED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
        with: {cosign-release: 'v3.1.3'}
      - name: Hash only synthetic receipt
        run: |
          mkdir -p /tmp/g9-witness
          sha256sum product/mobile/g9/receipts/LOCAL_CHECKPOINT.json | cut -d ' ' -f 1 > /tmp/g9-witness/synthetic-receipt.sha256
      - name: Sign public hash using verifiable GitHub OIDC
        run: cosign sign-blob --yes --bundle /tmp/g9-witness/bundle.sigstore.json /tmp/g9-witness/synthetic-receipt.sha256
      - name: Verify strict identity, issuer and transparency
        run: >-
          cosign verify-blob /tmp/g9-witness/synthetic-receipt.sha256
          --bundle /tmp/g9-witness/bundle.sigstore.json
          --certificate-identity https://github.com/miguelcastill85-del/qros-engine/.github/workflows/qros-mobile-g9-sigstore.yml@refs/heads/product/mobile-g9-cloudflare-android-20260926
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qros-g9-sigstore-bundle
          path: /tmp/g9-witness/
          retention-days: 3
          if-no-files-found: error
