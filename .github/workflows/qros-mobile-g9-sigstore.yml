name: QROS G9 synthetic hash transparency explicit gate
on:
  push:
    branches: [product/mobile-g9-cloudflare-android-20260926]
    paths: ['.github/workflows/qros-mobile-g9-sigstore.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qros-g9-public-transparency
  cancel-in-progress: false
jobs:
  witness:
    if: github.ref == 'refs/heads/product/mobile-g9-cloudflare-android-20260926' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      QROS_IDENTITY: https://github.com/miguelcastill85-del/qros-engine/.github/workflows/qros-mobile-g9-sigstore.yml@refs/heads/product/mobile-g9-cloudflare-android-20260926
      QROS_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Enforce exact authorized synthetic subject before public write
        run: |
          mkdir -p /tmp/g9-witness
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          a=json.loads(pathlib.Path('product/mobile/g9/receipts/SIGSTORE_AUTHORIZATION_20260929.json').read_bytes())
          assert a['authorized'] is True and a['paid_services_authorized'] is False
          assert a['repository_visibility_verified']=='public'
          assert a['subject_path']=='product/mobile/g9/receipts/ANDROID_VERIFIED_20260929.json'
          raw=pathlib.Path(a['subject_path']).read_bytes()
          h=hashlib.sha256(raw).hexdigest()
          assert h==a['subject_sha256']=='282ef82d1935afc4e9d07082f2c669d6e587025c1fd4afc71e7c33fa4c66df9f'
          r=json.loads(raw)
          assert r['scientific_gate_pass'] is False and r['release_signed'] is False
          assert r['apk_sha256']=='60107772a5b60f63a2b7e5d5ec24452ca9a52b05c886fcf15c8e859135074b01'
          pathlib.Path('/tmp/g9-witness/synthetic-receipt.sha256').write_text(h+'\n')
          pathlib.Path('/tmp/g9-witness/SUBJECT.json').write_text(json.dumps({'schema':'QROS_G9_SIGSTORE_SUBJECT_V1','subject_path':a['subject_path'],'subject_sha256':h,'subject_source_commit':a['subject_source_commit'],'signing_source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'scope':'SYNTHETIC_ENGINEERING_ONLY','independent_backend_custody':False},indent=2)+'\n')
          PY
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with: {cosign-release: 'v3.1.3'}
      - name: Sign only the hash using public GitHub OIDC and Rekor
        run: cosign sign-blob --yes --bundle /tmp/g9-witness/bundle.sigstore.json /tmp/g9-witness/synthetic-receipt.sha256
      - name: Verify identity, issuer and inclusion with Cosign
        run: |
          cosign verify-blob /tmp/g9-witness/synthetic-receipt.sha256 --bundle /tmp/g9-witness/bundle.sigstore.json --certificate-identity "$QROS_IDENTITY" --certificate-oidc-issuer "$QROS_ISSUER"
          printf '%s\n' 'COSIGN_STRICT_VERIFICATION_PASS' > /tmp/g9-witness/COSIGN_VERIFIED.txt
      - name: Preserve public bundle even if later verification fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qros-g9-sigstore-bundle
          path: /tmp/g9-witness/
          retention-days: 7
          if-no-files-found: error
  independent-verification:
    needs: witness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      QROS_IDENTITY: https://github.com/miguelcastill85-del/qros-engine/.github/workflows/qros-mobile-g9-sigstore.yml@refs/heads/product/mobile-g9-cloudflare-android-20260926
      QROS_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: qros-g9-sigstore-bundle, path: /tmp/g9-witness}
      - name: Install independent Python verifier
        run: |
          python3 -m venv /tmp/g9-sigstore-venv
          /tmp/g9-sigstore-venv/bin/pip install --disable-pip-version-check sigstore==4.5.0
      - name: Independently verify downloaded bundle and reject tamper and wrong identity
        run: |
          /tmp/g9-sigstore-venv/bin/python - <<'PY'
          import pathlib,subprocess,os,json,hashlib,sys
          d=pathlib.Path('/tmp/g9-witness');b=d/'bundle.sigstore.json';f=d/'synthetic-receipt.sha256'
          expected=b'282ef82d1935afc4e9d07082f2c669d6e587025c1fd4afc71e7c33fa4c66df9f\n'
          assert f.read_bytes()==expected
          def verify(path,identity):
              cmd=[sys.executable,'-m','sigstore','verify','identity','--bundle',str(b),'--cert-identity',identity,'--cert-oidc-issuer',os.environ['QROS_ISSUER'],str(path)]
              p=subprocess.run(cmd,capture_output=True,text=True)
              print(p.stdout);print(p.stderr)
              return p.returncode
          assert verify(f,os.environ['QROS_IDENTITY'])==0
          t=d/'tampered.sha256';t.write_bytes(b'0'*64+b'\n')
          assert verify(t,os.environ['QROS_IDENTITY'])!=0
          assert verify(f,'https://github.com/invalid/invalid/.github/workflows/invalid.yml@refs/heads/main')!=0
          t.unlink()
          bundle=json.loads(b.read_bytes());entries=bundle['verificationMaterial']['tlogEntries']
          assert entries and all(e.get('inclusionProof') for e in entries)
          r={'schema':'QROS_G9_SIGSTORE_INDEPENDENT_VERIFICATION_V1','status':'PASS','run_id':os.environ['GITHUB_RUN_ID'],'signing_source_commit':os.environ['GITHUB_SHA'],'cosign':'3.1.3 PASS','sigstore_python':'4.5.0 PASS','identity':os.environ['QROS_IDENTITY'],'issuer':os.environ['QROS_ISSUER'],'tamper_rejected':True,'wrong_identity_rejected':True,'bundle_sha256':hashlib.sha256(b.read_bytes()).hexdigest(),'subject_file_sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'transparency_entries':[{'log_index':e['logIndex'],'log_id':e['logId'],'kind_version':e.get('kindVersion'),'inclusion_proof_present':True} for e in entries],'independent_backend_custody':False,'physical_android':'NOT_RUN','scientific_gate_pass':False}
          (d/'INDEPENDENT_VERIFICATION.json').write_text(json.dumps(r,indent=2)+'\n');print(json.dumps(r,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qros-g9-sigstore-independently-verified
          path: /tmp/g9-witness/
          retention-days: 7
          if-no-files-found: error
