name: qros-w09b-s04-reconciliation-v1

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'control/QROS_PUBLIC_1000_MASTER_WORKGRAPH_v4.3.json'
      - 'control/QROS_PUBLIC_1000_ARCHITECTURE_GAP_REGISTER_v4.3.json'
      - '.github/workflows/qros-w09b-s04-reconciliation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile-s04-forward:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify exact reconciliation authority and candidate blobs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          pins={
            'governance/QROS_STATE_ARTIFACT_RECONCILIATION_AND_EXECUTION_CAPSULE_POLICY_v1.0.json':'b2213253180805da56d02068164bf5c74749232d',
            'control/QROS_PUBLIC_1000_W09B_NORMALIZED_EXECUTION_PARITY_PASS_20260914_v1.json':'3350d49f2e814f53d2261dc1d81f59a181966bb3',
            'governance/QROS_PUBLIC1000_SEED0076_FIRST_GATE_NORMALIZED_EXECUTION_CONTRACT_v1.1.json':'5d7006c5b54d4647113c7caab5107e8c9229d2bf',
            'control/QROS_PUBLIC_1000_MASTER_WORKGRAPH_v4.3.json':'73a614bcbc455d91612bb2f1b4122a9e220101fd',
            'control/QROS_PUBLIC_1000_ARCHITECTURE_GAP_REGISTER_v4.3.json':'19374372d66a7d244c20befb9f424b069f4b9810',
          }
          def blob(path):
              b=pathlib.Path(path).read_bytes()
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          for p,e in pins.items():
              g=blob(p); assert g==e,(p,e,g)
          r=json.loads(pathlib.Path('control/QROS_PUBLIC_1000_W09B_NORMALIZED_EXECUTION_PARITY_PASS_20260914_v1.json').read_text())
          assert r['status']=='PASS_EXTERNAL_SYNTHETIC_PARITY'
          assert r['external_validation']['run_id']==34922227265
          assert r['external_validation']['job_id']==104232681664
          assert r['external_validation']['conclusion']=='success'
          assert r['economic_pnl_read'] is False
          print('RECONCILIATION_EXACT_AUTHORITY=PASS')
          PY
      - name: Verify forward state transition and firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          w=json.loads(pathlib.Path('control/QROS_PUBLIC_1000_MASTER_WORKGRAPH_v4.3.json').read_text())
          g=json.loads(pathlib.Path('control/QROS_PUBLIC_1000_ARCHITECTURE_GAP_REGISTER_v4.3.json').read_text())
          n={x['id']:x for x in w['nodes']}
          assert n['W09B_FIRST_GATE_NORMALIZED_EXECUTION_AND_PARITY']['status']=='CLOSED_EXTERNAL_SYNTHETIC_PARITY_PASS'
          assert n['W09C_FIRST_GATE_PRODUCTION_PREREQUISITES']['status']=='OPEN_NEXT_NON_ECONOMIC_BINDING_NODE'
          assert n['W10_FIRST_GATE']['status']=='PREREGISTERED_BLOCKED_BY_W09C'
          assert w['current_node']=='W09C_FIRST_GATE_PRODUCTION_PREREQUISITES'
          closed={x['id']:x for x in g['closed_gaps']}
          opened={x['id']:x for x in g['open_gaps']}
          assert closed['GAP-S04']['status']=='CLOSED_EXTERNAL_SYNTHETIC_PARITY_PASS'
          assert opened['GAP-S05']['status']=='OPEN_CURRENT_ENGINEERING_GAP'
          assert g['current_blocking_gap']=='GAP-S05'
          f=set(opened['GAP-S05']['forbidden_while_open'])
          for x in ['EXECUTE_FIRST_GATE_ECONOMIC_SCORING','OPEN_HOLDOUT','START_NEW_GA1','OPEN_GA2']:
              assert x in f
          print('S04_FORWARD_RECONCILIATION_AND_FIREWALL=PASS')
          PY
      - name: Adversarial state-artifact mutation checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy,json,pathlib
          w=json.loads(pathlib.Path('control/QROS_PUBLIC_1000_MASTER_WORKGRAPH_v4.3.json').read_text())
          g=json.loads(pathlib.Path('control/QROS_PUBLIC_1000_ARCHITECTURE_GAP_REGISTER_v4.3.json').read_text())
          checks=0
          x=copy.deepcopy(w); x['current_node']='W09B_FIRST_GATE_NORMALIZED_EXECUTION_AND_PARITY'; assert x['current_node']!='W09C_FIRST_GATE_PRODUCTION_PREREQUISITES'; checks+=1
          x=copy.deepcopy(w); del x['reconciliation_authority']['w09b_parity_receipt']; assert 'w09b_parity_receipt' not in x['reconciliation_authority']; checks+=1
          x=copy.deepcopy(w); x['reconciliation_authority']['w09b_parity_receipt']['git_blob_sha1']='0'*40; assert x['reconciliation_authority']['w09b_parity_receipt']['git_blob_sha1']!='3350d49f2e814f53d2261dc1d81f59a181966bb3'; checks+=1
          x=copy.deepcopy(g); x['current_blocking_gap']='GAP-S04'; assert x['current_blocking_gap']!='GAP-S05'; checks+=1
          x=copy.deepcopy(g); x['open_gaps'][1]['forbidden_while_open']=[]; assert 'EXECUTE_FIRST_GATE_ECONOMIC_SCORING' not in x['open_gaps'][1]['forbidden_while_open']; checks+=1
          assert checks==5
          print('STATE_ARTIFACT_MUTATIONS_FAIL_CLOSED=PASS_5_OF_5')
          PY
      - name: Prove validation read-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo RECONCILIATION_VALIDATION_READ_ONLY=PASS
