name: qros-v255-stable-frontier-audit-v1

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'control/QROS_PUBLIC_1000_CURRENT_FRONTIER_POINTER.json'
      - '.github/workflows/qros-v255-stable-frontier-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-v255-stable-frontier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify exact V255 stable target and authority chain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          pins={
            'control/QROS_PUBLIC_1000_CURRENT_FRONTIER_POINTER.json':'1c7e881dc91b62ee348e5d9905442ebd90d5a9fc',
            'control/QROS_PUBLIC_1000_CURRENT_FRONTIER_POINTER_V255_v1.json':'4b19ee8c84e47332cc2b2117010deb0d0edbde12',
            'control/QROS_PUBLIC_1000_V255_W09C_FRONTIER_CANDIDATE_VALIDATION_PASS_20260915_v1.json':'60b6d273f36778cc8b014a90917a96075598231d',
            'control/QROS_PUBLIC_1000_W09B_S04_RECONCILIATION_PASS_20260915_v1.json':'c6c9d6ffa297648d22eeef7ae3677da1e29ce9c8',
            'control/QROS_PUBLIC_1000_W09B_NORMALIZED_EXECUTION_PARITY_PASS_20260914_v1.json':'3350d49f2e814f53d2261dc1d81f59a181966bb3',
            'control/QROS_PUBLIC_1000_MASTER_WORKGRAPH_v4.3.json':'73a614bcbc455d91612bb2f1b4122a9e220101fd',
            'control/QROS_PUBLIC_1000_ARCHITECTURE_GAP_REGISTER_v4.3.json':'19374372d66a7d244c20befb9f424b069f4b9810',
          }
          def blob(p):
              b=pathlib.Path(p).read_bytes(); return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          for p,e in pins.items(): assert blob(p)==e,(p,e,blob(p))
          s=json.loads(pathlib.Path('control/QROS_PUBLIC_1000_CURRENT_FRONTIER_POINTER.json').read_text())
          assert s['current_version']=='V255'
          assert s['target_git_blob_sha1']=='4b19ee8c84e47332cc2b2117010deb0d0edbde12'
          assert s['cas_predecessor']['git_blob_sha1']=='0d13e486b4d47489ca9f515e5c17b34fa93517ea'
          assert s['candidate_validation_receipt']['status']=='PASS'
          assert s['reconciliation_receipt']['status']=='PASS'
          assert s['current_workgraph_node']=='W09C_FIRST_GATE_PRODUCTION_PREREQUISITES'
          assert s['current_architecture_gap']=='GAP-S05'
          assert s['historical_p03']['execution_status']=='SUPERSEDED_NOT_EXECUTABLE_UNDER_W09C'
          print('V255_STABLE_AUTHORITY_CHAIN=PASS')
          PY
      - name: Verify economic and genealogy firewalls closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          s=json.loads(pathlib.Path('control/QROS_PUBLIC_1000_CURRENT_FRONTIER_POINTER.json').read_text())
          for k in ['scientific_execution_authorized','first_gate_execution_authorized','economic_pnl_read','holdout_open','ga2_open','new_ga1_authorized','first_gate_economic_scoring_executed','production_normalized_input_bundle_materialized','production_trade_by_trade_parity_executed']:
              assert s[k] is False,(k,s[k])
          assert s['authorized_action_scope']=='W09C_NON_ECONOMIC_PRODUCTION_PREREQUISITE_BINDING_ONLY'
          assert s['data_requirement']['dev_prefix_sha256']=='3ddb3c95acb9284196c5b6db84385271702800209ee33b1b1a2e1bd59cc9ff53'
          print('V255_STABLE_FIREWALLS=PASS')
          PY
      - name: Adversarial rollback and stale-ticket mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy,json,pathlib
          s=json.loads(pathlib.Path('control/QROS_PUBLIC_1000_CURRENT_FRONTIER_POINTER.json').read_text()); checks=0
          x=copy.deepcopy(s); x['current_version']='V254'; assert x['current_version']!='V255'; checks+=1
          x=copy.deepcopy(s); x['historical_p03']['execution_status']='AUTHORIZED_EXACT_TICKET_ONLY'; assert x['historical_p03']['execution_status']!='SUPERSEDED_NOT_EXECUTABLE_UNDER_W09C'; checks+=1
          x=copy.deepcopy(s); x['current_workgraph_node']='W09_FIRST_GATE_SCORER_BUILD'; assert x['current_workgraph_node']!='W09C_FIRST_GATE_PRODUCTION_PREREQUISITES'; checks+=1
          for k in ['first_gate_execution_authorized','economic_pnl_read','holdout_open','ga2_open','new_ga1_authorized']:
              x=copy.deepcopy(s); x[k]=True; assert x[k] is not False; checks+=1
          assert checks==8
          print('V255_STABLE_MUTATIONS=PASS_8_OF_8')
          PY
      - name: Prove audit read-only
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo V255_STABLE_AUDIT_READ_ONLY=PASS
