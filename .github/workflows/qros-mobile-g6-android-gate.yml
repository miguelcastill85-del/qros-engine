name: qros-mobile-g6-android-signed-snapshot-test-only
on:
  push:
    branches: [product/mobile-g6-android-snapshot-20260925]
    paths:
      - 'product/mobile/g6/**'
      - 'product/mobile/flutter_app/**'
      - '.github/workflows/qros-mobile-g6-android-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qros-mobile-g6-android
  cancel-in-progress: true
jobs:
  g6-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reject no-op, source drift and old verified authority mutation
        run: python product/mobile/g6/anti_stall_gate.py --remote-git
      - name: Install exact existing crypto dependency
        run: python -m pip install --disable-pip-version-check -r product/mobile/backend/requirements.txt
      - name: Python independent G5 fixture verification and byte regeneration
        run: |
          python product/mobile/g6/generate_fixture.py
          git diff --exit-code -- product/mobile/g6/tests/fixtures/g5_signed_snapshot_fixture.json
          python -m unittest discover -s product/mobile/g6/tests -v
      - name: Preserve M1/G1 signed backend regressions
        working-directory: product/mobile/backend
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: '3.35.4'}
      - name: Rehydrate Android wrapper only and resolve pinned dependencies
        working-directory: product/mobile/flutter_app
        run: |
          flutter create --platforms=android --project-name=qros_mobile_studio --org=app.qros --no-pub .
          flutter pub get
      - name: Analyze and run all M1/G1/G6 Flutter tests
        working-directory: product/mobile/flutter_app
        run: |
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
      - name: Build G6 Android TEST_ONLY debug APK
        working-directory: product/mobile/flutter_app
        run: |
          flutter build apk --debug --no-pub
          test -s build/app/outputs/flutter-apk/app-debug.apk
      - name: Freeze exact build receipt
        run: |
          mkdir -p /tmp/qros-g6-evidence
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          apk=pathlib.Path('product/mobile/flutter_app/build/app/outputs/flutter-apk/app-debug.apk')
          fixture=json.loads(pathlib.Path('product/mobile/g6/tests/fixtures/g5_signed_snapshot_fixture.json').read_text())
          r={'schema':'QROS_G6_ANDROID_CI_RECEIPT_V1','status':'PASS_ENGINEERING_TEST_ONLY',
             'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
             'apk_bytes':apk.stat().st_size,'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
             'fixture_payload_sha256':fixture['canonical_payload_sha256'],
             'python_dart_signed_snapshot_parity':'PASS_REQUIRED_STEP','flutter_all_tests':'PASS_REQUIRED_STEP',
             'backend_regressions':'PASS_REQUIRED_STEP','market_data':'NONE','economic_backtests':0,
             'holdout_open':False,'ga2_open':False,'public_https':'NOT_DEPLOYED',
             'external_independent_witness':'NOT_DEPLOYED','physical_android_install':'NOT_RUN',
             'release_signed':False,'scientific_gate_pass':False}
          pathlib.Path('/tmp/qros-g6-evidence/G6_ANDROID_CI_RECEIPT.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print(json.dumps(r,indent=2))
          PY
          cp product/mobile/g6/tests/fixtures/g5_signed_snapshot_fixture.json /tmp/qros-g6-evidence/
          cp product/mobile/flutter_app/build/app/outputs/flutter-apk/app-debug.apk /tmp/qros-g6-evidence/QROS_MOBILE_G6_TEST_ONLY.apk
      - uses: actions/upload-artifact@v4
        with:
          name: qros-mobile-g6-test-only-android
          retention-days: 3
          if-no-files-found: error
          path: /tmp/qros-g6-evidence/
