name: QROS Mobile G11 persistence safety TEST_ONLY

on:
  push:
    branches: [product/mobile-g11-persistence-hardening-20261002]
    paths:
      - 'product/mobile/flutter_app/**'
      - 'product/mobile/g9/emulator_smoke.py'
      - 'product/mobile/g9/receipts/PUBLIC_ROOT_20260928.json'
      - '.github/workflows/qros-mobile-g11-hardening.yml'
      - 'product/mobile/g11/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qros-mobile-g11-hardening
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 2}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.19.0'}

      - name: Rebuild exact G9 synthetic trust fixture
        run: |
          npm ci --ignore-scripts --prefix product/mobile/g9
          node --test product/mobile/g9/tests/workerd.test.mjs

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {channel: stable, flutter-version: '3.35.4'}

      - name: Rehydrate Android wrapper with secure-storage minimum SDK
        working-directory: product/mobile/flutter_app
        run: |
          flutter create --platforms=android --project-name=qros_mobile_studio --org=app.qros --no-pub .
          test -f android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          grep -F 'minSdk = 24' android/app/build.gradle.kts
          flutter pub get

      - name: Reproduce data loss on parent before validating correction
        working-directory: product/mobile/flutter_app
        run: |
          mkdir -p /tmp/qros-baseline-original
          for name in research_store universe_store; do
            cp "lib/core/$name.dart" "/tmp/qros-baseline-original/$name.dart"
            git show da2b18b1f5ea7c690f72007508a72ed6f6497c43:product/mobile/flutter_app/lib/core/$name.dart > "lib/core/$name.dart"
          done
          set +e
          flutter test --no-pub --reporter json test/storage_concurrency_test.dart > /tmp/qros-baseline.jsonl
          result=$?
          set -e
          for name in research_store universe_store; do
            cp "/tmp/qros-baseline-original/$name.dart" "lib/core/$name.dart"
          done
          test "$result" -ne 0
          python3 - <<'PY'
          import json
          events=[]
          for line in open('/tmp/qros-baseline.jsonl'):
              try: events.append(json.loads(line))
              except ValueError: pass
          failures=[e for e in events if e.get('type')=='testDone' and e.get('result')=='failure']
          assert len(failures)==6, f'Expected six reproduced data-integrity failures, observed {len(failures)}'
          print('BASELINE_DATA_INTEGRITY_FAILURES_REPRODUCED=6')
          PY

      - name: Analyze and run all Flutter regressions
        working-directory: product/mobile/flutter_app
        run: |
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded

      - name: Build G11 Android TEST_ONLY debug APK
        working-directory: product/mobile/flutter_app
        run: |
          flutter build apk --debug --no-pub
          test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Verify APK minimum SDK and freeze receipt
        run: |
          APK=product/mobile/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/qros-g11-badging.txt
          grep -F "sdkVersion:'24'" /tmp/qros-g11-badging.txt
          mkdir -p /tmp/qros-g11-android
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          apk=pathlib.Path('product/mobile/flutter_app/build/app/outputs/flutter-apk/app-debug.apk')
          root=json.loads(pathlib.Path('product/mobile/g9/receipts/PUBLIC_ROOT_20260928.json').read_text())
          receipt={
            'schema':'QROS_G11_ANDROID_CI_RECEIPT_V1',
            'status':'PASS_ENGINEERING_TEST_ONLY',
            'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'apk_bytes':apk.stat().st_size,
            'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
            'android_min_sdk':24,
            'secure_storage_dependency':'flutter_secure_storage@10.3.4',
            'secure_persistence_contract_tests':'PASS',
            'universe_rehash_on_restore':'PASS_TEST_FIXTURE',
            'public_https':root.get('origin'),
            'physical_secure_storage_runtime':'NOT_RUN',
            'physical_android_install':'NOT_RUN',
            'release_signed':False,
            'economic_tests':0,
            'holdout_open':False,
            'ga2_open':False,
            'mt5_executed':False,
            'scientific_gate_pass':False,
          }
          out=pathlib.Path('/tmp/qros-g11-android/QROS_G11_ANDROID_CI_RECEIPT.json')
          out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
          cp "$APK" /tmp/qros-g11-android/QROS_MOBILE_G11_TEST_ONLY.apk
          cp /tmp/qros-g11-badging.txt /tmp/qros-g11-android/
          cp /tmp/qros-baseline.jsonl /tmp/qros-g11-android/
          cp product/mobile/g9/receipts/PUBLIC_ROOT_20260928.json /tmp/qros-g11-android/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qros-mobile-g11-test-only-android
          retention-days: 7
          if-no-files-found: error
          path: /tmp/qros-g11-android/
