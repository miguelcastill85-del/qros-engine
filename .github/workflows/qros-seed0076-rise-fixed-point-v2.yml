name: qros-seed0076-rise-fixed-point-v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/qros_seed0076_rise_fixed_point_revalidate_v2.py'
      - 'scripts/qros_seed0076_rise_fixed_point_adversarial_v2.py'
      - '.github/workflows/qros-seed0076-rise-fixed-point-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rise-fixed-point-v2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact triggering commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir repo && cd repo
          git init -q
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo EXACT_TRIGGER_COMMIT_CHECKOUT=PASS

      - name: Syntax and exact source identities
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          python3 -m py_compile scripts/qros_seed0076_rise_fixed_point_revalidate_v1.py scripts/qros_seed0076_rise_fixed_point_revalidate_v2.py scripts/qros_seed0076_rise_fixed_point_oracle_v1.py scripts/qros_seed0076_rise_fixed_point_adversarial_v1.py scripts/qros_seed0076_rise_fixed_point_adversarial_v2.py
          echo PRIMARY_V2_BLOB=$(git hash-object scripts/qros_seed0076_rise_fixed_point_revalidate_v2.py)
          echo ORACLE_V1_BLOB=$(git hash-object scripts/qros_seed0076_rise_fixed_point_oracle_v1.py)
          echo ADVERSARIAL_V2_BLOB=$(git hash-object scripts/qros_seed0076_rise_fixed_point_adversarial_v2.py)
          echo SOURCE_SYNTAX_AND_IDENTITIES=PASS

      - name: Confirm corrected V251 kernel on exact current pointer
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=json.load(open('control/QROS_PUBLIC_1000_CURRENT_FRONTIER_POINTER.json'))
          assert p['current_version']=='V251'
          assert p['active_execution_validation_status']=='PASS'
          assert p['machine_action_type']=='RECOVER_OR_REVALIDATE_RISE_FIXED_POINT_NO_PNL'
          n=p['active_execution_validation_receipt']; q=pathlib.Path(n['path']); b=q.read_bytes(); got=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert got==n['git_blob_sha1']== 'f6dbbb42568db8abf4deaf3d346d2bf0f554f364'
          assert p['economic_pnl_read'] is False and p['ga2_open'] is False and p['holdout_open'] is False
          print('CORRECTED_STABLE_POINTER_AUTHORITY=PASS')
          PY

      - name: Primary non-economic RISE fixed-point revalidation v2
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          python3 scripts/qros_seed0076_rise_fixed_point_revalidate_v2.py --repo-root . --out /tmp/qros_rise_primary.json
          cat /tmp/qros_rise_primary.json

      - name: Independent RISE oracle
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          python3 scripts/qros_seed0076_rise_fixed_point_oracle_v1.py --repo-root . --primary /tmp/qros_rise_primary.json --out /tmp/qros_rise_oracle.json
          cat /tmp/qros_rise_oracle.json

      - name: Adversarial fail-closed suite v2
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          python3 scripts/qros_seed0076_rise_fixed_point_adversarial_v2.py --repo-root . --out /tmp/qros_rise_adversarial.json
          cat /tmp/qros_rise_adversarial.json

      - name: Final external consistency gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/qros_rise_primary.json')); o=json.load(open('/tmp/qros_rise_oracle.json')); a=json.load(open('/tmp/qros_rise_adversarial.json'))
          assert p['schema']=='QROS_SEED0076_POST_EXPANSION_RISE_FIXED_POINT_REVALIDATION_2.0'
          assert p['status']=='PASS' and p['decision']=='RISE_FIXED_POINT_REVALIDATED_NO_PNL'
          assert p['post_expansion_rise_fixed_point'] is True and p['rise_zero_delta_round_count']==2
          assert p['enumerator_parity_pass'] is True and p['enumerator_symmetric_difference_count']==0
          assert p['economic_pnl_read'] is False and p['holdout_open'] is False and p['ga2_open'] is False and p['zip_or_market_data_required'] is False
          assert p['validator_v2']['active_execution_receipt_git_blob_sha1']=='f6dbbb42568db8abf4deaf3d346d2bf0f554f364'
          assert o['status']=='PASS' and o['primary_receipt_sha256']==p['receipt_sha256']
          assert o['signal_universe_root_sha256']==p['signal_universe_root_sha256'] and o['ontology_root_sha256']==p['ontology_root_sha256']
          assert a['status']=='PASS' and a['negative_cases']==8
          print('QROS_SEED0076_RISE_FIXED_POINT_EXTERNAL_VALIDATION_V2=PASS')
          for k in ('receipt_sha256','signal_universe_root_sha256','management_universe_root_sha256','execution_universe_root_sha256','stress_universe_root_sha256','ontology_root_sha256','full_freeze_descriptor_root_sha256'): print(k.upper()+'='+p[k])
          print('ORACLE_RECEIPT_SHA256='+o['receipt_sha256'])
          print('ADVERSARIAL_RECEIPT_SHA256='+a['receipt_sha256'])
          PY
