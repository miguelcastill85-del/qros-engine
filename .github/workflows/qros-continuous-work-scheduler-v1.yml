name: qros-continuous-work-scheduler-v1
on:
  push:
    branches: [cws-v1.1-effect-proof-20260919]
    paths:
      - 'scripts/qros_continuous_work_scheduler_v1.py'
      - 'scripts/qros_continuous_work_scheduler_tests_v1.py'
      - 'governance/QROS_CONTINUOUS_WORK_SCHEDULER_GOVERNANCE_v1.1.json'
      - '.github/workflows/qros-continuous-work-scheduler-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact pins and candidate isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/qros_continuous_work_scheduler_v1.py)" = "692f5d496705495850981987616218ccf9bd750b"
          test "$(git hash-object scripts/qros_continuous_work_scheduler_tests_v1.py)" = "21cee0c786932950f1963433e0a2f9c3cf67fddf"
          python3 - <<'PY'
          import json
          g=json.load(open('governance/QROS_CONTINUOUS_WORK_SCHEDULER_GOVERNANCE_v1.1.json'))
          assert g['status']=='PREREGISTERED_NO_RESULTS'
          assert g['activation']['active'] is False
          assert 'DEK_V3_ONLY_SCIENTIFIC_REDUCER' in g['invariants']
          assert g['bpc_self_application_gate']['repository_native_transport'] is True
          assert g['version']=='v1.1'
          assert g['implementation']['scheduler']['git_blob_sha1']=='692f5d496705495850981987616218ccf9bd750b'
          assert g['implementation']['validation_oracle']['git_blob_sha1']=='21cee0c786932950f1963433e0a2f9c3cf67fddf'
          print('EXACT_V1_1_PINS_AND_ISOLATION=PASS')
          PY
      - name: Compile
        run: python3 -m py_compile scripts/qros_continuous_work_scheduler_v1.py scripts/qros_continuous_work_scheduler_tests_v1.py
      - name: Gates oracle chaos fixed-point
        working-directory: scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 qros_continuous_work_scheduler_tests_v1.py | tee ../cws_validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: cws-validation
          path: cws_validation.json
          retention-days: 1

  runner1:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - shell: bash

        run: |

          set -euo pipefail

          python3 scripts/qros_continuous_work_scheduler_tests_v1.py --stage 1 --state cws_state.json | tee stage1.json
      - uses: actions/upload-artifact@v4
        with:
          name: cws-state-1
          path: cws_state.json
          retention-days: 1

  runner2:
    needs: runner1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cws-state-1
          path: .
      - shell: bash

        run: |

          set -euo pipefail

          python3 scripts/qros_continuous_work_scheduler_tests_v1.py --stage 2 --state cws_state.json | tee stage2.json
      - uses: actions/upload-artifact@v4
        with:
          name: cws-state-2
          path: cws_state.json
          retention-days: 1

  runner3:
    needs: runner2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cws-state-2
          path: .
      - shell: bash

        run: |

          set -euo pipefail

          python3 scripts/qros_continuous_work_scheduler_tests_v1.py --stage 3 --state cws_state.json | tee stage3.json
      - uses: actions/upload-artifact@v4
        with:
          name: cws-state-3
          path: cws_state.json
          retention-days: 1

  runner4:
    needs: runner3
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cws-state-3
          path: .
      - shell: bash

        run: |

          set -euo pipefail

          python3 scripts/qros_continuous_work_scheduler_tests_v1.py --stage 4 --state cws_state.json | tee stage4.json
      - name: Verify terminal long-run state
        run: |
          python3 - <<'PY'
          import json,os
          s=json.load(open('cws_state.json'))
          assert s['phase']=='COMPLETE'
          assert s['progress_count']==10000
          assert s['terminal_root']=='6'*64
          assert os.path.getsize('cws_state.json') < 8192
          out=json.load(open('stage4.json'))
          assert out['certificate'] is not None
          print('MULTI_RUNNER_10000_UNITS=PASS')
          PY
