name: QROS GROUP11 Zero-Cost Self-Hosted Carrier Gate v1

on:
  push:
    branches: [main]
    paths:
      - 'control/QROS_GROUP11_ZERO_COST_JIT_TRIGGER.json'
  workflow_dispatch:
    inputs:
      source_dir:
        description: 'Local folder on the self-hosted runner containing XAU parts 001-008 (canonical names or Dropbox-prefixed names)'
        required: true
        type: string
      output_root:
        description: 'Local durable work root on the self-hosted runner'
        required: true
        default: 'C:\\QROS\\GROUP11\\work'
        type: string
      confirm_zero_cost:
        description: 'Must be true. This workflow is restricted to a self-hosted qros-zero-cost runner.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: qros-group11-zero-cost-selfhosted-carrier-gate
  cancel-in-progress: false

jobs:
  carrier-gate:
    if: ${{ github.event_name == 'push' || inputs.confirm_zero_cost == true }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact authority
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Authority and frozen-source preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @{
            'control/QROS_PUBLIC_1000_W09C_XAU_RUNTIME_MATERIALIZATION_MANIFEST_20260916_v1.json' = '622f21a62c532daaa824eafb202cf00a1c2b1a5d'
            'scripts/qros_seed0076_materialize_minimal_dev.py' = 'b543c8585258b21a007af84a53a944bba58678e6'
            'scripts/qros_seed0076_build_bar_cache_v220.py' = '987ef26aca2507a94247bed7663493e6682aa869'
            'scripts/qros_seed0076_build_indicator_cache_v220.py' = '21a50b167e791f4474e3c358b81e40065c048280'
            'scripts/qros_seed0076_indicators_v220.py' = 'b3575c061607aaae9f4062ad623ff7083e2e0ffe'
            'scripts/qros_group11_build_m1_only_v1.py' = '7e513c3002ec245043ee960297e3acab7234206c'
            'scripts/qros_group11_build_m1_indicators_only_v1.py' = '98f61576d25f64b4168df126bee6dba597c31a2f'
          }
          foreach ($p in $expected.Keys) {
            if (-not (Test-Path -LiteralPath $p)) { throw "MISSING_FROZEN_SOURCE:$p" }
            $blob = (git hash-object -- $p).Trim()
            if ($blob -ne $expected[$p]) { throw "FROZEN_SOURCE_DRIFT:$p:$blob" }
          }
          $ptr = Get-Content 'control/QROS_PUBLIC_1000_CURRENT_CHAT_HANDOFF.json' -Raw | ConvertFrom-Json
          if ($ptr.cws_status -ne 'GLOBAL_EXECUTION_GOVERNOR_ACTIVE') { throw 'CWS_NOT_ACTIVE' }
          $intent = Get-Content 'control/QROS_CWS_GROUP11_EXECUTION_INTENT_20260919_v1.json' -Raw | ConvertFrom-Json
          if ($intent.group_index -ne 11) { throw 'GROUP_BINDING_DRIFT' }
          if ($intent.spawn_authorized -ne $false) { throw 'AUTHORITY_DRIFT_SPAWN_AUTH_CHANGED' }
          if ($intent.economic_pnl_read -ne $false -or $intent.holdout_open -ne $false -or $intent.ga2_open -ne $false -or $intent.new_ga1_authorized -ne $false -or $intent.group12_opened -ne $false) { throw 'SCIENTIFIC_FIREWALL_OPEN' }
          $v6 = Get-Content 'control/QROS_CWS_GROUP11_DROPBOX_REMOTE_CARRIERS_8OF8_PASS_20260919_v6.json' -Raw | ConvertFrom-Json
          if ($v6.status -ne 'PASS' -or $v6.verification_method.result -ne 'PASS_8_OF_8_BYTE_IDENTITY') { throw 'REMOTE_CARRIER_PASS_MISSING' }

      - name: Prepare local run root and verify Python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Get-Command python -ErrorAction SilentlyContinue
          if (-not $python) { throw 'PYTHON_NOT_AVAILABLE_FAIL_CLOSED' }
          & $python.Source -c "import numpy,sys; print(sys.version); print('numpy', numpy.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'NUMPY_NOT_AVAILABLE_FAIL_CLOSED' }
          if ('${{ github.event_name }}' -eq 'push') {
            $baseRoot = Join-Path $env:RUNNER_TEMP 'qros-group11-zero-cost'
          } else {
            $baseRoot = '${{ inputs.output_root }}'
          }
          $runDir = Join-Path $baseRoot ('run-' + '${{ github.run_id }}')
          New-Item -ItemType Directory -Force -Path $runDir | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $runDir 'source') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $runDir 'jit-downloads') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $runDir 'dev') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $runDir 'bars') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $runDir 'indicators') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $runDir 'receipts') | Out-Null
          "QROS_WORK_DIR=$runDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "QROS_PYTHON=$($python.Source)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Normalize and SHA-256 verify XAU source ZIPs 8/8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.event_name }}' -eq 'push') {
            $triggerPath = 'control/QROS_GROUP11_ZERO_COST_JIT_TRIGGER.json'
            if (-not (Test-Path -LiteralPath $triggerPath)) { throw 'JIT_TRIGGER_NOT_FOUND' }
            $trigger = Get-Content -LiteralPath $triggerPath -Raw | ConvertFrom-Json
            if ($trigger.schema -ne 'QROS_GROUP11_ZERO_COST_JIT_TRIGGER_1.0' -or $trigger.status -ne 'ARMED') { throw 'JIT_TRIGGER_SCHEMA_OR_STATUS_INVALID' }
            if ($trigger.confirm_zero_cost -ne $true) { throw 'ZERO_COST_NOT_CONFIRMED' }
            $src = Join-Path $env:QROS_WORK_DIR 'jit-downloads'
            foreach ($c in $trigger.carriers) {
              $target = Join-Path $src $c.canonical_name
              Invoke-WebRequest -Uri $c.download_url -OutFile $target -UseBasicParsing
              if ((Get-Item -LiteralPath $target).Length -ne [int64]$c.bytes) { throw "JIT_DOWNLOAD_SIZE_MISMATCH:$($c.canonical_name)" }
              $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash.ToLowerInvariant()
              if ($sha -ne $c.sha256) { throw "JIT_DOWNLOAD_SHA256_MISMATCH:$($c.canonical_name):$sha" }
              Write-Host "PASS_JIT_DOWNLOAD $($c.canonical_name) $($c.bytes) $sha"
            }
          } else {
            $src = '${{ inputs.source_dir }}'
            if (-not (Test-Path -LiteralPath $src -PathType Container)) { throw 'SOURCE_DIR_NOT_FOUND' }
          }
          $rows = @(
            [pscustomobject]@{Name='QROS_XAU_FULL_HISTORY_v2_part001-of-035.zip';Bytes=102025545;Sha='d8a9c2138b184db087c087b4b3297ca2f4ba9da4991c49fb3332ebad0016bb70'},
            [pscustomobject]@{Name='QROS_XAU_FULL_HISTORY_v2_part002-of-035.zip';Bytes=100422805;Sha='159087740e5196849adac1905a0cbea777544833692745c89c331a4238d3be3a'},
            [pscustomobject]@{Name='QROS_XAU_FULL_HISTORY_v2_part003-of-035.zip';Bytes=99870071;Sha='ada6d3c587e46d2deceb28795d15962aeac9949f8d83d360260c28a7698116a9'},
            [pscustomobject]@{Name='QROS_XAU_FULL_HISTORY_v2_part004-of-035.zip';Bytes=101825467;Sha='241b74428b584819b54c1cfc5e3093e2efdbddfcbf42250cb9111c7d713ae241'},
            [pscustomobject]@{Name='QROS_XAU_FULL_HISTORY_v2_part005-of-035.zip';Bytes=101538275;Sha='3328ec3ef844450eaf9757bfe64fe6d23c38970b002ce7d0bac2c244e68f2aad'},
            [pscustomobject]@{Name='QROS_XAU_FULL_HISTORY_v2_part006-of-035.zip';Bytes=102849303;Sha='9bb324c3d274d718be6a714f22df51f8785a1e4fe0117531a45b860395bf5ab8'},
            [pscustomobject]@{Name='QROS_XAU_FULL_HISTORY_v2_part007-of-035.zip';Bytes=104515054;Sha='ddaff24ab8ccacc59de256c09e24738ad360eaa45efa004089611285c49c0185'},
            [pscustomobject]@{Name='QROS_XAU_FULL_HISTORY_v2_part008-of-035.zip';Bytes=104291866;Sha='362a9b7d04f0dd89ed5348e30c286e9b028d3f38521a18299cfa0b61d611d44b'}
          )
          $files = @(Get-ChildItem -LiteralPath $src -File)
          $dst = Join-Path $env:QROS_WORK_DIR 'source'
          foreach ($r in $rows) {
            $matches = @($files | Where-Object { $_.Name.EndsWith($r.Name, [System.StringComparison]::OrdinalIgnoreCase) })
            if ($matches.Count -ne 1) { throw "SOURCE_RESOLUTION_COUNT:$($r.Name):$($matches.Count)" }
            $f = $matches[0]
            if ($f.Length -ne $r.Bytes) { throw "SOURCE_SIZE_MISMATCH:$($r.Name):$($f.Length)" }
            $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $f.FullName).Hash.ToLowerInvariant()
            if ($sha -ne $r.Sha) { throw "SOURCE_SHA256_MISMATCH:$($r.Name):$sha" }
            Copy-Item -LiteralPath $f.FullName -Destination (Join-Path $dst $r.Name) -Force
            Write-Host "PASS_SOURCE $($r.Name) $($r.Bytes) $sha"
          }

      - name: Materialize exact DEV bytes with frozen materializer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = Join-Path $env:QROS_WORK_DIR 'receipts\dev_materialization.json'
          $out = Join-Path $env:QROS_WORK_DIR 'dev'
          & $env:QROS_PYTHON 'scripts/qros_seed0076_materialize_minimal_dev.py' --manifest 'control/QROS_PUBLIC_1000_W09C_XAU_RUNTIME_MATERIALIZATION_MANIFEST_20260916_v1.json' --source-dir (Join-Path $env:QROS_WORK_DIR 'source') --out-dir $out --asset XAUUSD --receipt $receipt
          if ($LASTEXITCODE -ne 0) { throw 'DEV_MATERIALIZER_FAIL' }
          $dev = Join-Path $out 'QROS_XAUUSD_DEV_2018_2019_PACKED17.bin'
          if ((Get-Item -LiteralPath $dev).Length -ne 2573500596) { throw 'DEV_SIZE_MISMATCH' }
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $dev).Hash.ToLowerInvariant()
          if ($sha -ne '3ddb3c95acb9284196c5b6db84385271702800209ee33b1b1a2e1bd59cc9ff53') { throw "DEV_SHA256_MISMATCH:$sha" }
          Write-Host "PASS_DEV 151382388 2573500596 $sha"

      - name: Build and verify exact M1 cache only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:QROS_PYTHON 'scripts/qros_group11_build_m1_only_v1.py' --ticks (Join-Path $env:QROS_WORK_DIR 'dev\QROS_XAUUSD_DEV_2018_2019_PACKED17.bin') --out-dir (Join-Path $env:QROS_WORK_DIR 'bars') --receipt (Join-Path $env:QROS_WORK_DIR 'receipts\m1.json')
          if ($LASTEXITCODE -ne 0) { throw 'M1_GATE_FAIL' }

      - name: Build and verify exact M1 indicators only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:QROS_PYTHON 'scripts/qros_group11_build_m1_indicators_only_v1.py' --bars (Join-Path $env:QROS_WORK_DIR 'bars\XAUUSD_M1_BID_BARS.npy') --out-dir (Join-Path $env:QROS_WORK_DIR 'indicators') --receipt (Join-Path $env:QROS_WORK_DIR 'receipts\m1_indicators.json')
          if ($LASTEXITCODE -ne 0) { throw 'M1_INDICATOR_GATE_FAIL' }

      - name: Emit local carrier-gate PASS receipt (no artifact upload)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dev = Get-Content (Join-Path $env:QROS_WORK_DIR 'receipts\dev_materialization.json') -Raw | ConvertFrom-Json
          $m1 = Get-Content (Join-Path $env:QROS_WORK_DIR 'receipts\m1.json') -Raw | ConvertFrom-Json
          $ind = Get-Content (Join-Path $env:QROS_WORK_DIR 'receipts\m1_indicators.json') -Raw | ConvertFrom-Json
          $final = [ordered]@{
            schema = 'QROS_GROUP11_ZERO_COST_SELFHOSTED_CARRIER_GATE_RECEIPT_1.0'
            status = 'PASS'
            run_id = '${{ github.run_id }}'
            runner_name = '${{ runner.name }}'
            runner_os = '${{ runner.os }}'
            source_zip_sha256 = 'PASS_8_OF_8'
            dev_sha256 = '3ddb3c95acb9284196c5b6db84385271702800209ee33b1b1a2e1bd59cc9ff53'
            m1_content_sha256 = $m1.content_sha256
            indicator_m1_content_root_sha256 = $ind.content_root_sha256
            economic_pnl_read = $false
            holdout_open = $false
            ga2_open = $false
            new_ga1_authorized = $false
            group12_opened = $false
            group11_spawned = $false
            next_action = 'PERSIST_THIS_PASS_THEN_DEK_SCHEDULE_EXACTLY_ONE_GROUP11_TRANSITION'
          }
          $out = Join-Path $env:QROS_WORK_DIR 'receipts\QROS_GROUP11_ZERO_COST_SELFHOSTED_CARRIER_GATE_PASS.json'
          $final | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $out -Encoding utf8
          Write-Host 'QROS_GROUP11_ZERO_COST_SELFHOSTED_CARRIER_GATE_PASS'
          Get-Content -LiteralPath $out -Raw
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '### QROS GROUP11 carrier gate: PASS'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'No economic PnL, holdout, GA2, new GA1, GROUP12, or GROUP11 spawn was executed.'
