name: QROS G9 live HTTPS pinned-root canary
on:
  push:
    branches: ['product/mobile-g9-cloudflare-android-20260926']
    paths: ['.github/workflows/qros-mobile-g9-live.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qros-g9-disabled-bootstrap
  cancel-in-progress: false
jobs:
  live:
    if: github.ref == 'refs/heads/product/mobile-g9-cloudflare-android-20260926' && vars.QROS_G9_FREE_PLAN_VERIFIED == 'true'
    environment: qros-g9-test-only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.19.0'}
      - run: npm ci --ignore-scripts
        working-directory: product/mobile/g9
      - run: |
          node --test product/mobile/g9/tests/core.test.mjs
          node --test product/mobile/g9/tests/workerd.test.mjs
          node --test product/mobile/g9/tests/provision-root.test.mjs
          python3 -m pip install cryptography==46.0.5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {channel: stable, flutter-version: '3.35.4'}
      - run: flutter pub get
        working-directory: product/mobile/flutter_app
      - name: Enable scoped endpoint using existing provider secrets
        working-directory: product/mobile/g9
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: ./node_modules/.bin/wrangler deploy --var ENABLED:true --var PUBLIC_ORIGIN:https://qros-mobile-g9-test-only.miguelcastill85.workers.dev
      - name: Bounded live canary; clear grants on exit
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node product/mobile/g9/scripts/live-canary.mjs
      - name: Independent Python verifies HTTPS bytes
        run: python3 product/mobile/g9/tests/oracle.py
      - name: Unchanged G6 Dart verifier checks HTTPS bytes
        working-directory: product/mobile/flutter_app
        run: flutter test --reporter expanded test/g9_worker_parity_test.dart test/g9_transport_negative_test.dart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qros-g9-live-https
          path: |
            product/mobile/g9/evidence/worker_snapshot.json
            product/mobile/g9/evidence/parity_fixture.json
            product/mobile/g9/evidence/live_canary.json
            product/mobile/g9/evidence/python_oracle.json
            product/mobile/g9/receipts/PUBLIC_ROOT_20260928.json
          retention-days: 7
          if-no-files-found: error
