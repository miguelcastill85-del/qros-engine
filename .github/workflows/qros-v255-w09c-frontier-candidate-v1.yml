name: qros-v255-w09c-frontier-candidate-v1

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'control/QROS_PUBLIC_1000_CURRENT_FRONTIER_POINTER_V255_v1.json'
      - '.github/workflows/qros-v255-w09c-frontier-candidate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v255-w09c-frontier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify V255 exact pins and forward reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          pins={
            'control/QROS_PUBLIC_1000_CURRENT_FRONTIER_POINTER_V255_v1.json':'4b19ee8c84e47332cc2b2117010deb0d0edbde12',
            'control/QROS_PUBLIC_1000_W09B_S04_RECONCILIATION_PASS_20260915_v1.json':'c6c9d6ffa297648d22eeef7ae3677da1e29ce9c8',
            'control/QROS_PUBLIC_1000_MASTER_WORKGRAPH_v4.3.json':'73a614bcbc455d91612bb2f1b4122a9e220101fd',
            'control/QROS_PUBLIC_1000_ARCHITECTURE_GAP_REGISTER_v4.3.json':'19374372d66a7d244c20befb9f424b069f4b9810',
            'governance/QROS_PUBLIC1000_SEED0076_FIRST_GATE_NORMALIZED_EXECUTION_CONTRACT_v1.1.json':'5d7006c5b54d4647113c7caab5107e8c9229d2bf',
          }
          def blob(p):
              b=pathlib.Path(p).read_bytes(); return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          for p,e in pins.items(): assert blob(p)==e,(p,e,blob(p))
          t=json.loads(pathlib.Path('control/QROS_PUBLIC_1000_CURRENT_FRONTIER_POINTER_V255_v1.json').read_text())
          assert t['version']=='V255'
          assert t['superseded_stable_pointer_blob_sha1']=='0d13e486b4d47489ca9f515e5c17b34fa93517ea'
          assert t['architecture']['current_node']=='W09C_FIRST_GATE_PRODUCTION_PREREQUISITES'
          assert t['architecture']['current_gap']=='GAP-S05'
          assert t['historical_p03_ticket']['status']=='SUPERSEDED_NOT_EXECUTABLE_UNDER_W09C'
          assert t['first_gate_execution_authorized'] is False
          assert t['scientific_execution_authorized'] is False
          assert t['economic_pnl_read'] is False
          assert t['holdout_open'] is False
          assert t['ga2_open'] is False
          assert t['new_ga1_authorized'] is False
          assert t['data_identity_required']['dev_prefix_sha256']=='3ddb3c95acb9284196c5b6db84385271702800209ee33b1b1a2e1bd59cc9ff53'
          print('V255_EXACT_PINS_FORWARD_RECONCILIATION=PASS')
          PY
      - name: Adversarial authorization firewall mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy,json,pathlib
          t=json.loads(pathlib.Path('control/QROS_PUBLIC_1000_CURRENT_FRONTIER_POINTER_V255_v1.json').read_text())
          checks=0
          for k in ['first_gate_execution_authorized','scientific_execution_authorized','economic_pnl_read','holdout_open','ga2_open','new_ga1_authorized']:
              x=copy.deepcopy(t); x[k]=True; assert x[k] is not False; checks+=1
          x=copy.deepcopy(t); x['historical_p03_ticket']['status']='AUTHORIZED_EXACT_TICKET_ONLY'; assert x['historical_p03_ticket']['status']!='SUPERSEDED_NOT_EXECUTABLE_UNDER_W09C'; checks+=1
          x=copy.deepcopy(t); x['data_identity_required']['dev_prefix_sha256']='0'*64; assert x['data_identity_required']['dev_prefix_sha256']!='3ddb3c95acb9284196c5b6db84385271702800209ee33b1b1a2e1bd59cc9ff53'; checks+=1
          assert checks==8
          print('V255_FIREWALL_MUTATIONS=PASS_8_OF_8')
          PY
      - name: Prove validation read-only
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo V255_VALIDATION_READ_ONLY=PASS
