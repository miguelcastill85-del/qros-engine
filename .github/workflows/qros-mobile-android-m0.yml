name: qros-mobile-android-m0-test-only

on:
  push:
    branches:
      - product/mobile-m2-ledger-prototype-20260925
    paths:
      - 'product/mobile/flutter_app/**'
      - '.github/workflows/qros-mobile-android-m0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qros-mobile-android-m0-test-only
  cancel-in-progress: true

jobs:
  android-test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up pinned Flutter 3.35.4
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.4'
      - name: Verify scope and Flutter toolchain
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          flutter --version
          test -f product/mobile/MOBILE_PRODUCT_HEAD.json
          test -f product/mobile/flutter_app/pubspec.yaml
          test ! -d product/mobile/flutter_app/windows
          test ! -d product/mobile/flutter_app/macos
      - name: Create native Android wrapper from pinned Flutter template
        working-directory: product/mobile/flutter_app
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --project-name=qros_mobile_studio --org=app.qros --no-pub .
          flutter pub get
      - name: Analyze Flutter source
        working-directory: product/mobile/flutter_app
        shell: bash
        run: flutter analyze --no-pub
      - name: Run model and mobile widget tests
        working-directory: product/mobile/flutter_app
        shell: bash
        run: flutter test --no-pub --reporter expanded
      - name: Build installable Android debug APK
        working-directory: product/mobile/flutter_app
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --no-pub
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
      - name: Produce TEST_ONLY reproducibility receipt
        if: success()
        working-directory: product/mobile/flutter_app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib, pathlib, subprocess
          apk = pathlib.Path('build/app/outputs/flutter-apk/app-debug.apk')
          version = json.loads(subprocess.check_output(['flutter', '--version', '--machine'], text=True))
          source_commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          receipt = {
              'schema': 'QROS_ANDROID_M0_BUILD_RECEIPT_V1',
              'status': 'PASS_ENGINEERING_TEST_ONLY',
              'source_commit': source_commit,
              'flutter_framework_version': version.get('frameworkVersion'),
              'flutter_framework_revision': version.get('frameworkRevision'),
              'dart_sdk_version': version.get('dartSdkVersion'),
              'runner': 'ubuntu-latest',
              'java': '17',
              'apk_filename': apk.name,
              'apk_bytes': apk.stat().st_size,
              'apk_sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
              'flutter_analyze': 'PASS_PREVIOUS_REQUIRED_STEP',
              'flutter_test': 'PASS_PREVIOUS_REQUIRED_STEP',
              'mobile_os_target': 'ANDROID_DEBUG',
              'device_installation_test': 'NOT_RUN',
              'user_data': 'SYNTHETIC_AND_VOLATILE_LOCAL_DRAFTS_ONLY',
              'scientific_gate_pass': False,
              'real_broker_data_accessed': False,
              'mt5_executed': False,
              'product_release_approved': False
          }
          pathlib.Path('qros_android_m0_build_receipt.json').write_text(json.dumps(receipt, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Save APK and build receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qros-android-m0-debug-apk-test-only
          path: |
            product/mobile/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
            product/mobile/flutter_app/qros_android_m0_build_receipt.json
          retention-days: 5
          if-no-files-found: error
