name: QROS Mobile G12 sessions and resumable jobs TEST_ONLY

on:
  push:
    branches: [product/mobile-g12-renewable-session-jobs-20261002]
    paths:
      - 'product/mobile/flutter_app/**'
      - 'product/mobile/g12/worker/**'
      - 'product/mobile/g12/tests/**'
      - 'product/mobile/g12/package*.json'
      - 'product/mobile/g12/wrangler.jsonc'
      - '.github/workflows/qros-mobile-g12.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qros-mobile-g12
  cancel-in-progress: true

jobs:
  change-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Verify fail-closed reuse contract
        run: python3 product/mobile/g12_deployment/ci_reuse_guard_test.py
      - id: scope
        name: Reuse only exact previously verified build inputs and recipe
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 product/mobile/g12_deployment/ci_reuse_guard.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qros-g12-build-reuse-receipt
          path: /tmp/qros-g12-build-reuse.json
          retention-days: 14
          if-no-files-found: error

  test-and-build:
    needs: change-scope
    if: needs.change-scope.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.19.0'}

      - name: Install and test isolated G12 Worker
        run: |
          npm ci --ignore-scripts --prefix product/mobile/g12
          node --test product/mobile/g12/tests/core.test.mjs product/mobile/g12/tests/workerd.test.mjs product/mobile/g12/tests/security.test.mjs
          ./product/mobile/g12/node_modules/.bin/wrangler deploy --dry-run --config product/mobile/g12/wrangler.jsonc --outdir /tmp/qros-g12-worker

      - name: Rebuild frozen G9 signed parity fixture
        run: |
          npm ci --ignore-scripts --prefix product/mobile/g9
          node --test product/mobile/g9/tests/workerd.test.mjs

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {channel: stable, flutter-version: '3.35.4'}

      - name: Rehydrate Android wrapper
        working-directory: product/mobile/flutter_app
        run: |
          flutter create --platforms=android --project-name=qros_mobile_studio --org=app.qros --no-pub .
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          grep -F 'minSdk = 24' android/app/build.gradle.kts
          flutter pub get

      - name: Reproduce G12 session and retry defects on parent
        working-directory: product/mobile/flutter_app
        run: |
          if git diff --quiet 217cd842cb195fa92e52aa39068b97892752e48e HEAD -- lib/core/session_client.dart test/session_recovery_regression_test.dart; then
            printf '%s\n' '{"status":"REUSED_VERIFIED_BASELINE","source_commit":"217cd842cb195fa92e52aa39068b97892752e48e","ci_run":37126514681,"verified_parent_failures":4}' > /tmp/qros-g12-session-baseline-reuse.json
            exit 0
          fi
          cp lib/core/session_client.dart /tmp/qros-g12-session-fixed.dart
          git show 0055c99aad927d7c847c662240f5db4f044f4825:product/mobile/flutter_app/lib/core/session_client.dart > lib/core/session_client.dart
          set +e
          flutter test --no-pub --reporter json test/session_recovery_regression_test.dart > /tmp/qros-g12-session-baseline.jsonl 2>&1
          BASELINE_EXIT=$?
          set -e
          cp /tmp/qros-g12-session-fixed.dart lib/core/session_client.dart
          test "$BASELINE_EXIT" -ne 0
          python3 - <<'PY'
          import json,pathlib
          rows=[]
          for line in pathlib.Path('/tmp/qros-g12-session-baseline.jsonl').read_text().splitlines():
              try: rows.append(json.loads(line))
              except ValueError: pass
          failures=[r for r in rows if r.get('type')=='testDone' and r.get('result')=='failure']
          assert len(failures)==4, len(failures)
          print('G12_BASELINE_SESSION_AND_RETRY_FAILURES=4')
          PY

      - name: Analyze and run Flutter regressions
        working-directory: product/mobile/flutter_app
        run: |
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded

      - name: Build G12 Android TEST_ONLY APK
        working-directory: product/mobile/flutter_app
        run: |
          flutter build apk --debug --no-pub
          test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Freeze G12 engineering receipt
        run: |
          mkdir -p /tmp/qros-g12
          APK=product/mobile/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee /tmp/qros-g12/apk-badging.txt
          grep -F "sdkVersion:'24'" /tmp/qros-g12/apk-badging.txt
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          apk=pathlib.Path('product/mobile/flutter_app/build/app/outputs/flutter-apk/app-debug.apk')
          receipt={
            'schema':'QROS_G12_ENGINEERING_RECEIPT_V1',
            'status':'PASS_ENGINEERING_TEST_ONLY',
            'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'apk_bytes':apk.stat().st_size,
            'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
            'worker_workerd_restart_resume':'PASS',
            'session_refresh_rotation':'PASS',
            'flutter_secure_session_recovery':'PASS',
            'flutter_job_resume_recovery':'PASS',
            'worker_deploy_dry_run':'PASS',
            'android_min_sdk':24,
            'public_g12_deployment':'NOT_RUN',
            'physical_android':'NOT_RUN',
            'economic_tests':0,
            'holdout_open':False,
            'ga2_open':False,
            'mt5_executed':False,
            'scientific_gate_pass':False,
          }
          pathlib.Path('/tmp/qros-g12/QROS_G12_ENGINEERING_RECEIPT.json').write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
          cp "$APK" /tmp/qros-g12/QROS_MOBILE_G12_TEST_ONLY.apk
          cp -R /tmp/qros-g12-worker /tmp/qros-g12/worker-dry-run
          if [ -f /tmp/qros-g12-session-baseline.jsonl ]; then cp /tmp/qros-g12-session-baseline.jsonl /tmp/qros-g12/; fi
          if [ -f /tmp/qros-g12-session-baseline-reuse.json ]; then cp /tmp/qros-g12-session-baseline-reuse.json /tmp/qros-g12/; fi
          cp product/mobile/flutter_app/test/fixtures/g12_result_python.json /tmp/qros-g12/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qros-mobile-g12-test-only
          retention-days: 7
          if-no-files-found: error
          path: /tmp/qros-g12/

  emulator:
    needs: test-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qros-mobile-g12-test-only
          path: /tmp/qros-g12-runtime/input
      - name: Enable emulator virtualization and install existing PNG verifier dependency
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Install previously verified APK without rebuilding it and navigate G12
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 540
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 product/mobile/g12_deployment/android_smoke_current.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qros-g12-android35-runtime-evidence
          retention-days: 7
          if-no-files-found: error
          path: /tmp/qros-g12-runtime/evidence/
