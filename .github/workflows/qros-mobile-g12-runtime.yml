name: QROS G12 exact APK Android 35 runtime
on:
  push:
    branches: [product/mobile-g12-renewable-session-jobs-20261002]
    paths:
      - '.github/workflows/qros-mobile-g12-runtime.yml'
      - 'product/mobile/g12_deployment/android_smoke.py'
      - 'product/mobile/g12_deployment/startup_state*.py'
      - 'product/mobile/g12_deployment/build_native_probe.py'
      - 'product/mobile/g12_deployment/native_probe/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: qros-g12-android35-exact-apk
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qros-mobile-g12-test-only
          run-id: 37259618369
          github-token: ${{ github.token }}
          path: /tmp/qros-g12-runtime/input
      - name: Verify startup readiness classifier
        run: python3 product/mobile/g12_deployment/startup_state_test.py
      - name: Enable emulator virtualization and install existing PNG verifier dependency
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Install previously verified APK without rebuilding it and navigate G12
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 540
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 product/mobile/g12_deployment/android_smoke.py --input /tmp/qros-g12-runtime/input --evidence /tmp/qros-g12-runtime/evidence --source e2c9b0a4404ebdd3d821abc7d9672f547f43f357 --apk-sha b6250899380e781e0d5b38667d5a6e6f3660cfb458032589c0bc60cbb094ddc4 --apk-bytes 146666937
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qros-g12-android35-runtime-evidence
          retention-days: 7
          if-no-files-found: error
          path: /tmp/qros-g12-runtime/evidence/
